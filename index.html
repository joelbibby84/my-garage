<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20242b"><link rel="manifest" href="manifest.json">
<title>My Garage</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#20242b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#20242b;color:#fff;padding:16px;position:sticky;top:0;z-index:2}main{max-width:760px;margin:auto;padding:14px}
h1,h2,h3,p{margin:0}h1{font-size:25px}h2{font-size:19px}.muted{color:#68707c;font-size:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 1px 5px #0001}
.vehicle{display:flex;gap:14px;align-items:center;cursor:pointer}.icon{font-size:34px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button{border:0;border-radius:11px;padding:11px 14px;background:#2563eb;color:white;font-weight:700;font-size:15px}button.secondary{background:#e5e7eb;color:#20242b}button.danger{background:#fee2e2;color:#991b1b}
.back{background:transparent;padding:0;margin-bottom:6px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;background:#e5e7eb;color:#333}.tabs .active{background:#2563eb;color:white}
.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:#dcfce7;color:#166534}.soon{background:#ffedd5;color:#9a3412}.overdue{background:#fee2e2;color:#991b1b}
.task{border-left:5px solid #16a34a}.task.soon{border-left-color:#d97706}.task.overdue{border-left-color:#dc2626}.empty{text-align:center;color:#68707c;padding:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
dialog{border:0;border-radius:18px;width:min(94%,620px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}.modal{padding:18px}
.part-entry{border:1px solid #d1d5db;border-radius:12px;padding:12px;margin-top:10px;background:#f8f9fa}.part-entry h3{font-size:15px;margin-bottom:4px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div style="max-width:760px;margin:auto"><button id="back" class="back" style="display:none">‹ My Garage</button><h1 id="title">My Garage</h1></div></header>
<main id="app"></main>

<dialog id="taskDlg"><form method="dialog" class="modal" id="taskForm">
<h2 id="taskHeading">Add maintenance task</h2>
<label>Task</label><input id="taskName" required placeholder="Engine oil & filter">
<div class="grid"><div><label>Frequency — months</label><input id="taskMonths" type="number" min="0"></div>
<div><label>Frequency — miles</label><input id="taskMiles" type="number" min="0"></div>
<div><label>Last done — date</label><input id="taskDate" type="date"></div>
<div><label>Last done — mileage</label><input id="taskLastMiles" type="number" min="0"></div></div>
<label>Notes</label><textarea id="taskNotes" rows="3"></textarea>
<div class="row" style="margin-top:13px"><button>Save task</button><button type="button" class="secondary" onclick="taskDlg.close()">Cancel</button></div>
</form></dialog>

<dialog id="vehicleDlg"><form method="dialog" class="modal" id="vehicleForm">
<h2>Edit vehicle</h2><label>Registration</label><input id="vehicleReg">
<label>Current mileage</label><input id="vehicleMileage" type="number" min="0">
<label>Notes / modifications</label><textarea id="vehicleNotes" rows="4"></textarea>
<div class="row" style="margin-top:13px"><button>Save</button><button type="button" class="secondary" onclick="vehicleDlg.close()">Cancel</button></div>
</form></dialog>

<dialog id="recordDlg"><form method="dialog" class="modal" id="recordForm">
<h2 id="recordHeading">Record completed work</h2>
<label>Job / service</label><input id="recordJob" required>
<div class="grid"><div><label>Date</label><input id="recordDate" type="date" required></div><div><label>Mileage</label><input id="recordMileage" type="number" min="0"></div>
<div><label>Cost (£)</label><input id="recordCost" type="number" min="0" step="0.01"></div></div>
<label>Parts / oils used</label>
<div id="recordPartsList"></div>
<button type="button" class="secondary" style="margin-top:10px" onclick="addRecordPart()">+ Add another part</button>
<label>Notes</label><textarea id="recordNotes" rows="3"></textarea>
<div class="row" style="margin-top:13px"><button>Save record</button><button type="button" class="secondary" onclick="recordDlg.close()">Cancel</button></div>
</form></dialog>

<dialog id="partDlg"><form method="dialog" class="modal" id="partForm">
<h2 id="partHeading">Add part / oil</h2><label>Part / product</label><input id="partName" required>
<div class="grid"><div><label>Date fitted</label><input id="partDate" type="date"></div><div><label>Mileage fitted</label><input id="partMileage" type="number" min="0"></div>
<div><label>Category / type</label><input id="partCategory" placeholder="Oil, filter, brake..."></div><div><label>Manufacturer</label><input id="partMaker"></div>
<div><label>Part number</label><input id="partNumber"></div><div><label>Cost (£)</label><input id="partCost" type="number" min="0" step="0.01"></div></div>
<label>Specification</label><input id="partSpec" placeholder="10W-40">
<label>Notes</label><textarea id="partNotes" rows="3"></textarea>
<div class="row" style="margin-top:13px"><button>Save part</button><button type="button" class="secondary" onclick="partDlg.close()">Cancel</button></div>
</form></dialog>

<script>
const SUPABASE_URL="https://baqdlzrdyuzgjdsjzenl.supabase.co";
const SUPABASE_KEY="sb_publishable_Clz_wO8YPjTQOqrlbZ2d4w_RSimZxDH";
const KEY="myGarageV1";
const starter=[
{id:"skoda",name:"Skoda Superb",year:2010,engine:"2.0 TDI",emoji:"🚗",reg:"",mileage:"",notes:"",tasks:[],history:[],parts:[]},
{id:"corsa",name:"Vauxhall Corsa",year:2016,engine:"1.4 Petrol",emoji:"🚗",reg:"",mileage:"",notes:"",tasks:[],history:[],parts:[]},
{id:"st1300",name:"Honda Pan European ST1300",year:2012,engine:"ST1300",emoji:"🏍️",reg:"",mileage:"",notes:"",tasks:[],history:[],parts:[]},
{id:"gsx250",name:"Suzuki GSX250",year:1982,engine:"GSX250",emoji:"🏍️",reg:"",mileage:"",notes:"",tasks:[],history:[],parts:[]}
];
let db=JSON.parse(localStorage.getItem(KEY)||"null")||starter,current=null,tab="maintenance",editing=-1,editingPart=-1,recordTaskIndex=-1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const v=()=>db.find(x=>x.id===current);
const dateText=d=>d?new Date(d+"T00:00:00").toLocaleDateString("en-GB"):"—";

async function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 try{
  const response=await fetch(`${SUPABASE_URL}/rest/v1/garage_data?id=eq.1`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Prefer":"return=representation"},body:JSON.stringify({data:db})});
  if(!response.ok)console.error("Supabase save error:",response.status,await response.text());
 }catch(e){console.error("Supabase connection error:",e)}
}
function calc(t){let d=null,m=null;if(t.months&&t.date){d=new Date(t.date+"T00:00:00");d.setMonth(d.getMonth()+Number(t.months))}if(t.miles&&t.lastMiles)m=Number(t.lastMiles)+Number(t.miles);return{d,m}}
function status(t){let c=calc(t),now=new Date(),cur=v().mileage===""?null:Number(v().mileage);let od=(c.d&&now>=c.d)||(c.m&&cur!=null&&cur>=c.m);let so=!od&&((c.d&&(c.d-now)<=30*86400000)||(c.m&&cur!=null&&(c.m-cur)<=500));return{c,od,so,label:od?"OVERDUE":so?"DUE SOON":"OK"}}
function due(t){let c=calc(t),a=c.d?dateText(c.d.toISOString().slice(0,10)):"",b=c.m?c.m.toLocaleString()+" miles":"";return[a,b].filter(Boolean).join(" OR ")||"Not scheduled"}

function render(){
 if(!current){
  $("back").style.display="none";$("title").textContent="My Garage";
  $("app").innerHTML=`<div class="card"><h2>Your vehicles</h2><p class="muted" style="margin-top:5px">Tap a vehicle to manage it.</p></div>`+
  db.map(x=>`<div class="card vehicle" onclick="openV('${x.id}')"><div class="icon">${x.emoji}</div><div><h2>${esc(x.name)}</h2><p class="muted">${x.year} · ${esc(x.engine)}${x.mileage!==""?" · "+Number(x.mileage).toLocaleString()+" miles":""}</p></div></div>`).join("")+`
  <div class="card"><h3>Backup</h3><p class="muted" style="margin:5px 0 10px">Export a backup before changing phones.</p><div class="row"><button onclick="backup()">Export backup</button><button class="secondary" onclick="restore()">Import backup</button></div></div>`;return
 }
 $("back").style.display="block";$("title").textContent=v().name;
 $("app").innerHTML=`<div class="card"><div class="row between"><div><div class="muted">${v().year} · ${esc(v().engine)}</div><h2>${v().emoji} ${esc(v().name)}</h2><p class="muted">${v().reg||"Registration not entered"}${v().mileage!==""?" · "+Number(v().mileage).toLocaleString()+" miles":" · Mileage not entered"}</p></div><button class="secondary" onclick="editVehicle()">Edit</button></div></div>
 <div class="tabs"><button class="${tab=="maintenance"?"active":""}" onclick="tab='maintenance';render()">🔧 Maintenance</button><button class="${tab=="history"?"active":""}" onclick="tab='history';render()">📖 History</button><button class="${tab=="parts"?"active":""}" onclick="tab='parts';render()">🔩 Parts & Oils</button><button class="${tab=="notes"?"active":""}" onclick="tab='notes';render()">📝 Notes</button></div>`+(tab=="maintenance"?maintenance():tab=="history"?history():tab=="parts"?parts():notes())
}
function maintenance(){return `<div class="row between"><div><h3>Maintenance</h3><p class="muted">Date or mileage — whichever comes first.</p></div><button onclick="newTask()">+ Add task</button></div>`+
(v().tasks.length?v().tasks.map((t,i)=>{let s=status(t);return `<div class="card task ${s.od?"overdue":s.so?"soon":"ok"}"><div class="row between"><div><h3>${esc(t.name)}</h3><p class="muted">${t.months?t.months+" months":""}${t.months&&t.miles?" / ":""}${t.miles?Number(t.miles).toLocaleString()+" miles":""}</p></div><span class="badge ${s.od?"overdue":s.so?"soon":"ok"}">${s.label}</span></div><p style="margin-top:8px"><b>Next due:</b> ${esc(due(t))}</p><p class="muted">Last done: ${dateText(t.date)}${t.lastMiles?" · "+Number(t.lastMiles).toLocaleString()+" miles":""}</p><div class="row" style="margin-top:10px"><button onclick="completeTask(${i})">✓ Record completed</button><button class="secondary" onclick="editTask(${i})">Edit</button><button class="danger" onclick="delTask(${i})">Delete</button></div></div>`}).join(""):`<div class="card empty">No maintenance tasks yet.<br>Add your first one above.</div>`)}`}

function history(){let h=v().history||[];return `<div class="row between"><div><h3>Maintenance history</h3><p class="muted">Everything recorded as completed.</p></div><button onclick="newRecord()">+ Add record</button></div>`+(h.length?h.slice().reverse().map((r,displayIndex)=>{let i=h.length-1-displayIndex;return `<div class="card"><h3>${esc(r.job)}</h3><p class="muted" style="margin-top:8px"><b>Date:</b> ${dateText(r.date)}</p>${r.mileage?`<p class="muted" style="margin-top:5px"><b>Mileage:</b> ${Number(r.mileage).toLocaleString()} miles</p>`:""}${r.cost?`<p class="muted" style="margin-top:5px"><b>Cost:</b> £${Number(r.cost).toFixed(2)}</p>`:""}${r.parts&&r.parts.length?`<p style="margin-top:8px"><b>Parts/oils:</b> ${r.parts.map(x=>esc(x.name)).join(", ")}</p>`:r.partsText?`<p style="margin-top:8px"><b>Parts/oil:</b> ${esc(r.partsText)}</p>`:""}${r.notes?`<p class="muted" style="margin-top:6px;white-space:pre-wrap">${esc(r.notes)}</p>`:""}<div class="row" style="margin-top:10px"><button class="secondary" onclick="editRecord(${i})">Edit</button><button class="danger" onclick="deleteRecord(${i})">Delete</button></div></div>`}).join(""):`<div class="card empty">No history recorded yet.</div>`)}`}

function parts(){let p=v().parts||[];return `<div class="row between"><div><h3>Parts & Oils</h3><p class="muted">Record exactly what you fitted or used.</p></div><button onclick="newPart()">+ Add part</button></div>`+(p.length?p.slice().reverse().map((x,displayIndex)=>{let i=p.length-1-displayIndex;return `<div class="card"><div class="row between"><h3>${esc(x.name)}</h3><span class="muted">${dateText(x.date)}</span></div><p class="muted">${[x.category,x.maker,x.number].filter(Boolean).map(esc).join(" · ")}</p>${x.spec?`<p style="margin-top:6px"><b>Specification:</b> ${esc(x.spec)}</p>`:""}<p class="muted">${x.mileage?Number(x.mileage).toLocaleString()+" miles":""}${x.cost?" · £"+Number(x.cost).toFixed(2):""}</p>${x.notes?`<p class="muted" style="white-space:pre-wrap">${esc(x.notes)}</p>`:""}<div class="row" style="margin-top:10px"><button class="secondary" onclick="editPart(${i})">Edit</button><button class="danger" onclick="deletePart(${i})">Delete</button></div></div>`}).join(""):`<div class="card empty">No parts or oils recorded yet.</div>`)}`}
function notes(){return `<div class="card"><h3>Vehicle notes & modifications</h3><p style="margin-top:8px;white-space:pre-wrap">${esc(v().notes)||'<span class="muted">No notes yet.</span>'}</p></div>`}

function newTask(){editing=-1;$("taskForm").reset();$("taskHeading").textContent="Add maintenance task";$("taskDlg").showModal()}
function editTask(i){editing=i;let t=v().tasks[i];$("taskName").value=t.name||"";$("taskMonths").value=t.months||"";$("taskMiles").value=t.miles||"";$("taskDate").value=t.date||"";$("taskLastMiles").value=t.lastMiles||"";$("taskNotes").value=t.notes||"";$("taskHeading").textContent="Edit maintenance task";$("taskDlg").showModal()}
$("taskForm").onsubmit=()=>{let t={name:$("taskName").value.trim(),months:$("taskMonths").value,miles:$("taskMiles").value,date:$("taskDate").value,lastMiles:$("taskLastMiles").value,notes:$("taskNotes").value.trim()};editing<0?v().tasks.push(t):v().tasks[editing]=t;save();render()}
function delTask(i){if(confirm("Are you sure you want to delete this maintenance task?")){v().tasks.splice(i,1);save();render()}}
function editVehicle(){$("vehicleReg").value=v().reg||"";$("vehicleMileage").value=v().mileage||"";$("vehicleNotes").value=v().notes||"";$("vehicleDlg").showModal()}
$("vehicleForm").onsubmit=()=>{v().reg=$("vehicleReg").value.trim();v().mileage=$("vehicleMileage").value;v().notes=$("vehicleNotes").value.trim();save();render()}

function resetRecordParts(parts=[]){$("recordPartsList").innerHTML="";(parts.length?parts:[{}]).forEach(p=>addRecordPart(p))}
function addRecordPart(p={}){let n=$("recordPartsList").children.length;let d=document.createElement("div");d.className="part-entry";d.innerHTML=`<h3>Part ${n+1}</h3><div class="grid"><div><label>Part / product</label><input class="rp-name" value="${esc(p.name||"")}" placeholder="Oil filter"></div><div><label>Category / type</label><input class="rp-category" value="${esc(p.category||"")}" placeholder="Filter, oil, brake..."></div><div><label>Manufacturer</label><input class="rp-maker" value="${esc(p.maker||"")}"></div><div><label>Part number</label><input class="rp-number" value="${esc(p.number||"")}"></div><div><label>Specification</label><input class="rp-spec" value="${esc(p.spec||"")}" placeholder="10W-40"></div><div><label>Cost (£)</label><input class="rp-cost" type="number" min="0" step="0.01" value="${esc(p.cost||"")}"></div></div><div class="row" style="margin-top:8px"><button type="button" class="danger" onclick="this.closest('.part-entry').remove();renumberRecordParts()">Remove part</button></div>`;$("recordPartsList").appendChild(d)}
function renumberRecordParts(){[...$("recordPartsList").children].forEach((x,i)=>x.querySelector("h3").textContent="Part "+(i+1))}
function collectRecordParts(){return [...$("recordPartsList").querySelectorAll(".part-entry")].map(x=>({name:x.querySelector(".rp-name").value.trim(),category:x.querySelector(".rp-category").value.trim(),maker:x.querySelector(".rp-maker").value.trim(),number:x.querySelector(".rp-number").value.trim(),spec:x.querySelector(".rp-spec").value.trim(),cost:x.querySelector(".rp-cost").value})).filter(x=>x.name)}
function completeTask(i){let t=v().tasks[i];recordTaskIndex=i;editing=-1;$("recordForm").reset();$("recordHeading").textContent="Record completed: "+t.name;$("recordJob").value=t.name;$("recordDate").value=new Date().toISOString().slice(0,10);$("recordMileage").value=v().mileage||"";$("recordCost").value="";$("recordNotes").value="";resetRecordParts();$("recordDlg").showModal()}
function newRecord(){recordTaskIndex=-1;editing=-1;$("recordForm").reset();$("recordHeading").textContent="Record completed work";$("recordDate").value=new Date().toISOString().slice(0,10);resetRecordParts();$("recordDlg").showModal()}
$("recordForm").onsubmit=()=>{let r={job:$("recordJob").value.trim(),date:$("recordDate").value,mileage:$("recordMileage").value,cost:$("recordCost").value,parts:collectRecordParts(),notes:$("recordNotes").value.trim()};if(editing<0)v().history.push(r);else v().history[editing]=r;if(r.mileage&&Number(r.mileage)>Number(v().mileage||0))v().mileage=r.mileage;if(recordTaskIndex>=0){let t=v().tasks[recordTaskIndex];t.date=r.date;t.lastMiles=r.mileage||t.lastMiles||""}r.parts.forEach(p=>v().parts.push({name:p.name,date:r.date,mileage:r.mileage,category:p.category,maker:p.maker,number:p.number,cost:p.cost,spec:p.spec,notes:"From maintenance: "+r.job}));editing=-1;recordTaskIndex=-1;save();render()}
function editRecord(i){let r=v().history[i];editing=i;recordTaskIndex=-1;$("recordHeading").textContent="Edit maintenance record";$("recordJob").value=r.job||"";$("recordDate").value=r.date||"";$("recordMileage").value=r.mileage||"";$("recordCost").value=r.cost||"";$("recordNotes").value=r.notes||"";resetRecordParts(r.parts||[]);$("recordDlg").showModal()}
function deleteRecord(i){if(confirm("Are you sure you want to delete this maintenance history entry?\n\nThe record will be removed, but any parts already added to Parts & Oils will not be removed automatically.")){v().history.splice(i,1);save();render()}}

function newPart(){editingPart=-1;$("partForm").reset();$("partHeading").textContent="Add part / oil";$("partDate").value=new Date().toISOString().slice(0,10);$("partDlg").showModal()}
function editPart(i){editingPart=i;let p=v().parts[i];$("partHeading").textContent="Edit part / oil";$("partName").value=p.name||"";$("partDate").value=p.date||"";$("partMileage").value=p.mileage||"";$("partCategory").value=p.category||"";$("partMaker").value=p.maker||"";$("partNumber").value=p.number||"";$("partCost").value=p.cost||"";$("partSpec").value=p.spec||"";$("partNotes").value=p.notes||"";$("partDlg").showModal()}
$("partForm").onsubmit=()=>{let p={name:$("partName").value.trim(),date:$("partDate").value,mileage:$("partMileage").value,category:$("partCategory").value.trim(),maker:$("partMaker").value.trim(),number:$("partNumber").value.trim(),cost:$("partCost").value,spec:$("partSpec").value.trim(),notes:$("partNotes").value.trim()};editingPart<0?v().parts.push(p):v().parts[editingPart]=p;editingPart=-1;save();render()}
function deletePart(i){if(confirm("Are you sure you want to delete this part/oil entry?")){v().parts.splice(i,1);save();render()}}

function openV(id){current=id;tab="maintenance";render()}$("back").onclick=()=>{current=null;render()}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="my-garage-backup.json";a.click()}
function restore(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();current=null;render();alert("Backup restored.")}catch(e){alert("Invalid backup.")}};r.readAsText(i.files[0])};i.click()}
async function loadFromSupabase(){try{const response=await fetch(`${SUPABASE_URL}/rest/v1/garage_data?id=eq.1&select=data`,{headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`}});if(!response.ok){console.error("Supabase load error:",response.status,await response.text());return}const rows=await response.json();if(rows.length&&rows[0].data){const cloudData=rows[0].data;if(Array.isArray(cloudData)&&cloudData.length>0){db=cloudData;localStorage.setItem(KEY,JSON.stringify(db))}}}catch(e){console.error("Supabase load failed:",e)}}
async function startApp(){await loadFromSupabase();render()}startApp();
</script>
</body></html>

const esc=s=>

function uid(prefix="id"){
 if(window.crypto&&crypto.randomUUID){
  return prefix+"_"+crypto.randomUUID();
 }
 return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2);
}

function sameText(a,b){
 return String(a||"").trim().toLowerCase()===
        String(b||"").trim().toLowerCase();
}

function blankVehicle(base){
 return {
  id:base.id,
  name:base.name,
  year:base.year,
  engine:base.engine,
  emoji:base.emoji,
  reg:"",
  mileage:"",
  notes:"",
  tasks:[],
  history:[],
  parts:[]
 };
}


function normaliseVehicle(x,base){

 const source=x&&typeof x==="object"?x:{};

 const vehicle={
  ...blankVehicle(base),
  ...source,

  id:base.id,
  name:base.name,
  year:base.year,
  engine:base.engine,
  emoji:base.emoji,

  reg:source.reg==null?"":String(source.reg),
  mileage:source.mileage==null?"":String(source.mileage),
  notes:source.notes==null?"":String(source.notes),

  tasks:Array.isArray(source.tasks)
   ?source.tasks.map(t=>({
      ...t,
      id:t.id||uid("task")
     }))
   :[],

  history:Array.isArray(source.history)
   ?source.history.map(r=>({
      ...r,
      id:r.id||uid("history"),
      partIds:Array.isArray(r.partIds)?r.partIds:[]
     }))
   :[],

  parts:Array.isArray(source.parts)
   ?source.parts.map(p=>({
      ...p,
      id:p.id||uid("part")
     }))
   :[]
 };

 vehicle.history.forEach(r=>{

  if(!r.taskId){

   const task=vehicle.tasks.find(
    t=>sameText(t.name,r.job)
   );

   if(task){
    r.taskId=task.id;
   }

  }

 });


 vehicle.parts.forEach(p=>{

  if(!p.taskId){

   let jobName="";

   if(
    p.notes &&
    String(p.notes).toLowerCase().startsWith("from maintenance:")
   ){
    jobName=String(p.notes)
     .substring(String(p.notes).indexOf(":")+1)
     .trim();
   }

   if(jobName){

    const task=vehicle.tasks.find(
     t=>sameText(t.name,jobName)
    );

    if(task){
     p.taskId=task.id;
    }

   }

  }


  if(!p.historyId){

   const possible=vehicle.history.find(r=>{

    if(p.taskId&&r.taskId&&p.taskId!==r.taskId){
     return false;
    }

    if(
     p.date &&
     r.date &&
     p.date!==r.date
    ){
     return false;
    }

    if(
     p.mileage &&
     r.mileage &&
     String(p.mileage)!==String(r.mileage)
    ){
     return false;
    }

    return (
     !p.taskId ||
     r.taskId===p.taskId ||
     sameText(r.job,
      String(p.notes||"").replace(/^From maintenance:\s*/i,"")
     )
    );

   });

   if(possible){
    p.historyId=possible.id;

    if(!p.taskId&&possible.taskId){
     p.taskId=possible.taskId;
    }
   }

  }

 });


 vehicle.history.forEach(r=>{

  if(!Array.isArray(r.partIds)){
   r.partIds=[];
  }

  const oldParts=Array.isArray(r.parts)?r.parts:[];

  oldParts.forEach(old=>{

   let match=vehicle.parts.find(p=>
    p.historyId===r.id &&
    sameText(p.name,old.name) &&
    (
     !old.number ||
     !p.number ||
     sameText(p.number,old.number)
    )
   );

   if(!match){

    match=vehicle.parts.find(p=>
     !p.historyId &&
     sameText(p.name,old.name) &&
     (
      !r.date ||
      !p.date ||
      p.date===r.date
     ) &&
     (
      !r.mileage ||
      !p.mileage ||
      String(p.mileage)===String(r.mileage)
     )
    );

   }

   if(match){

    match.historyId=r.id;

    if(r.taskId){
     match.taskId=r.taskId;
    }

   }else{

    match={
     id:uid("part"),
     name:old.name||"",
     date:r.date||"",
     mileage:r.mileage||"",
     category:old.category||"",
     maker:old.maker||"",
     number:old.number||"",
     cost:old.cost||"",
     spec:old.spec||"",
     notes:"From maintenance: "+(r.job||""),
     taskId:r.taskId||null,
     historyId:r.id
    };

    vehicle.parts.push(match);

   }

   if(
    match.id &&
    !r.partIds.includes(match.id)
   ){
    r.partIds.push(match.id);
   }

  });


  vehicle.parts
   .filter(p=>p.historyId===r.id)
   .forEach(p=>{

    if(!r.partIds.includes(p.id)){
     r.partIds.push(p.id);
    }

   });

 });


 vehicle.parts.forEach(p=>{

  if(p.historyId&&!p.taskId){

   const r=vehicle.history.find(
    h=>h.id===p.historyId
   );

   if(r&&r.taskId){
    p.taskId=r.taskId;
   }

  }

 });

 return vehicle;
}


function vehicleMatches(x,base){

 if(!x||typeof x!=="object"){
  return false;
 }

 const id=String(x.id||"").toLowerCase();
 const name=String(x.name||"").toLowerCase();

 return (
  id===base.id ||
  name===base.name.toLowerCase() ||
  (
   Number(x.year)===base.year &&
   name.includes(
    base.name.split(" ")[0].toLowerCase()
   )
  )
 );

}


function normaliseDatabase(input){

 if(!Array.isArray(input)){
  return null;
 }

 return starter.map(base=>{

  const found=input.find(
   x=>vehicleMatches(x,base)
  );

  return normaliseVehicle(found,base);

 });

}

 }catch(e){

 }

 const fresh=starter.map(
  x=>blankVehicle(x)
 );

 localStorage.setItem(
  KEY,
  JSON.stringify(fresh)
 );

 return fresh;
}

async function supabaseRequest(url,options={}){

 const response=await fetch(
  url,
  {
   ...options,
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY,
    "Authorization":`Bearer ${SUPABASE_KEY}`,
    ...(options.headers||{})
   }
  }
 );

 const text=await response.text();

 let body=null;

 try{
  body=text?JSON.parse(text):null;
 }catch(e){
  body=text;
 }

 return {response,body};
}

async function save(){

 db=
  normaliseDatabase(db) ||
  starter.map(x=>blankVehicle(x));

 localStorage.setItem(
  KEY,
  JSON.stringify(db)
 );

 try{

  const result=
   await supabaseRequest(

    `${SUPABASE_URL}/rest/v1/garage_data?on_conflict=id`,

    {
     method:"POST",

     headers:{
      "Prefer":
       "resolution=merge-duplicates,return=representation"
     },

     body:JSON.stringify({
      id:CLOUD_ID,
      data:db
     })
    }

   );


  if(!result.response.ok){

   console.error(
    "Supabase save failed:",
    result.response.status,
    result.body
   );

   let detail="";

   if(
    result.body &&
    typeof result.body==="object"
   ){

    detail=
     result.body.message ||
     result.body.details ||
     result.body.hint ||
     JSON.stringify(result.body);

   }else if(result.body){

    detail=String(result.body);

   }


   showStatus(
    "Cloud save failed ("+
    result.response.status+
    ")"+
    (detail?" — "+detail:""),
    "error"
   );

   return false;
  }


  showStatus(
   "Saved to cloud ✓",
   "ok"
  );

  return true;


 }catch(e){

  console.error(
   "Supabase connection error:",
   e
  );

  showStatus(
   "Cloud connection failed — "+
   (e?.message||String(e)),
   "error"
  );

  return false;
 }

}


async function loadFromSupabase(){

 try{

  const result=await supabaseRequest(
   `${SUPABASE_URL}/rest/v1/garage_data?id=eq.${CLOUD_ID}&select=id,data`,
   {method:"GET"}
  );

  if(!result.response.ok){

   console.error(
    "Supabase load error:",
    result.response.status,
    result.body
   );

   return false;
  }

  const rows=Array.isArray(result.body)
   ?result.body
   :[];

  if(
   !rows.length ||
   !rows[0] ||
   !rows[0].data
  ){
   return false;
  }

  const fixed=normaliseDatabase(
   rows[0].data
  );

  if(!fixed){
   return false;
  }

  db=fixed;

  localStorage.setItem(
   KEY,
   JSON.stringify(db)
  );

  return true;

 }catch(e){

  console.error(
   "Supabase load failed:",
   e
  );

  return false;
 }

}


function calc(t){

 let d=null;
 let m=null;

 if(t.months&&t.date){

  d=new Date(
   t.date+"T00:00:00"
  );

  d.setMonth(
   d.getMonth()+Number(t.months)
  );

 }

 if(t.miles&&t.lastMiles){

  m=
   Number(t.lastMiles)+
   Number(t.miles);

 }

 return {d,m};
}


function statusForVehicle(vehicle,t){

 if(!vehicle){
  return{
   c:{},
   od:false,
   so:false,
   label:"OK"
  };
 }

 const c=calc(t);
 const now=new Date();

 const cur=
  vehicle.mileage===""
  ?null
  :Number(vehicle.mileage);

 const od=
  (c.d&&now>=c.d) ||
  (c.m&&cur!=null&&cur>=c.m);

 const so=
  !od &&
  (
   (c.d&&(c.d-now)<=30*86400000) ||
   (c.m&&cur!=null&&(c.m-cur)<=500)
  );

 return{
  c,
  od,
  so,
  label:od
   ?"OVERDUE"
   :so
    ?"DUE SOON"
    :"OK"
 };

}


function status(t){
 return statusForVehicle(v(),t);
}


function due(t){

 const c=calc(t);

 const a=c.d
  ?dateText(c.d.toISOString().slice(0,10))
  :"";

 const b=c.m
  ?c.m.toLocaleString()+" miles"
  :"";

 return [a,b]
  .filter(Boolean)
  .join(" OR ") ||
  "Not scheduled";
}


function linkedPartsForTask(taskId){

 return (v()?.parts||[])
  .filter(p=>p.taskId===taskId);

}


function linkedPartsForHistory(historyId){

 return (v()?.parts||[])
  .filter(p=>p.historyId===historyId);

}


function linkedHistoryForTask(taskId){

 return (v()?.history||[])
  .filter(r=>r.taskId===taskId);

}


/* DASHBOARD */

function getDashboardItems(){

 const items=[];

 db.forEach(vehicle=>{

  vehicle.tasks.forEach(task=>{

   const s=statusForVehicle(vehicle,task);
   const c=calc(task);

   const currentMiles=
    vehicle.mileage===""
    ?null
    :Number(vehicle.mileage);

   const mileGap=
    c.m&&currentMiles!=null
    ?c.m-currentMiles
    :999999999;

   const dateTime=
    c.d
    ?c.d.getTime()
    :9999999999999;

   let priority=3;

   if(s.od){
    priority=0;
   }else if(s.so){
    priority=1;
   }else if(c.d||c.m){
    priority=2;
   }

   items.push({
    vehicle,
    task,
    status:s,
    priority,
    dateTime,
    mileGap
   });

  });

 });

 items.sort((a,b)=>{

  if(a.priority!==b.priority){
   return a.priority-b.priority;
  }

  if(a.dateTime!==b.dateTime){
   return a.dateTime-b.dateTime;
  }

  return a.mileGap-b.mileGap;

 });

 return items;
}

function newTask(){

function editTask(i){

 editing=i;

 const t=v().tasks[i];

 $("taskName").value=t.name||"";
 $("taskMonths").value=t.months||"";
 $("taskMiles").value=t.miles||"";
 $("taskDate").value=t.date||"";
 $("taskLastMiles").value=t.lastMiles||"";
 $("taskNotes").value=t.notes||"";

 $("taskHeading").textContent=
  "Edit maintenance task";

 $("taskDlg").showModal();
}


$("taskForm").onsubmit=()=>{

 const existing=
  editing>=0
  ?v().tasks[editing]
  :null;

 const t={

  id:existing?.id||uid("task"),

  name:$("taskName").value.trim(),

  months:$("taskMonths").value,

  miles:$("taskMiles").value,

  date:$("taskDate").value,

  lastMiles:$("taskLastMiles").value,

  notes:$("taskNotes").value.trim()

 };

 if(editing<0){

  v().tasks.push(t);

 }else{

  v().tasks[editing]=t;

 }

 editing=-1;

 save();
 render();
};


function delTask(i){

 const task=v().tasks[i];

 const linkedParts=
  linkedPartsForTask(task.id);

 const linkedHistory=
  linkedHistoryForTask(task.id);

 let message=
  "Are you sure you want to delete this maintenance task?";

 if(linkedParts.length||linkedHistory.length){

  message+=
   "\n\nIts History and Parts & Oils records will be kept, but they will no longer be linked to this maintenance task.";

 }

 if(!confirm(message)){
  return;
 }

 linkedParts.forEach(p=>{
  p.taskId=null;
 });

 linkedHistory.forEach(r=>{
  r.taskId=null;
 });

 v().tasks.splice(i,1);

 save();
 render();
}

     value="${esc(p.cost||"")}">
   </div>

  </div>

  <div
   class="row"
   style="margin-top:8px">

   <button
    type="button"
    class="danger"
    onclick="
     this.closest('.part-entry').remove();
     renumberRecordParts();
    ">

    Remove part

   </button>

  </div>
 `;

 $("recordPartsList")
  .appendChild(d);

}


function renumberRecordParts(){

 [...$("recordPartsList").children]
  .forEach((x,i)=>{

   x.querySelector("h3")
    .textContent="Part "+(i+1);

  });

}


function collectRecordParts(){

 return [
  ...$("recordPartsList")
   .querySelectorAll(".part-entry")
 ].map(x=>({

  name:
   x.querySelector(".rp-name")
    .value.trim(),

  category:
   x.querySelector(".rp-category")
    .value.trim(),

  maker:
   x.querySelector(".rp-maker")
    .value.trim(),

  number:
   x.querySelector(".rp-number")
    .value.trim(),

  spec:
   x.querySelector(".rp-spec")
    .value.trim(),

  cost:
   x.querySelector(".rp-cost")
    .value

 }))
 .filter(x=>x.name);

}


/* COMPLETE A MAINTENANCE TASK */

function completeTask(i){

 const t=v().tasks[i];

 recordTaskId=t.id;
 editingRecordId=null;
 editing=-1;

 $("recordForm").reset();

 $("recordHeading").textContent=
  "Record completed: "+t.name;

 $("recordJob").value=t.name;
 $("recordDate").value=today();
 $("recordMileage").value=v().mileage||"";
 $("recordCost").value="";
 $("recordNotes").value="";

 resetRecordParts();

 $("recordDlg").showModal();
}


/* MANUAL HISTORY ENTRY */

function newRecord(){

 recordTaskId=null;
 editingRecordId=null;
 editing=-1;

 $("recordForm").reset();

 $("recordHeading").textContent=
  "Record completed work";

 $("recordDate").value=today();

 resetRecordParts();

 $("recordDlg").showModal();
}


/* SAVE HISTORY */

$("recordForm").onsubmit=()=>{

 const vehicle=v();

 const enteredParts=
  collectRecordParts();

 const oldRecord=
  editingRecordId
  ?historyById(editingRecordId)
  :null;

 const recordId=
  oldRecord?.id||
  uid("history");

 const taskId=
  recordTaskId ||
  oldRecord?.taskId ||
  null;

 const r={

  id:recordId,

  taskId:taskId,

  job:
   $("recordJob").value.trim(),

  date:
   $("recordDate").value,

  mileage:
   $("recordMileage").value,

  cost:
   $("recordCost").value,

  notes:
   $("recordNotes").value.trim(),

  partIds:[]

 };


 let historyIndex=-1;

 if(oldRecord){

  historyIndex=
   vehicle.history.findIndex(
    x=>x.id===oldRecord.id
   );

 }


 if(oldRecord){

  vehicle.parts=
   vehicle.parts.filter(
    p=>p.historyId!==oldRecord.id
   );

 }


 enteredParts.forEach(p=>{

  const linkedPart={

   id:uid("part"),

   name:p.name,

   date:r.date,

   mileage:r.mileage,

   category:p.category,

   maker:p.maker,

   number:p.number,

   cost:p.cost,

   spec:p.spec,

   notes:
    "From maintenance: "+r.job,

   taskId:r.taskId,

   historyId:r.id

  };

  vehicle.parts.push(linkedPart);

  r.partIds.push(
   linkedPart.id
  );

 });


 if(historyIndex>=0){

  vehicle.history[historyIndex]=r;

 }else{

  vehicle.history.push(r);

 }


 if(
  r.mileage &&
  Number(r.mileage)>
  Number(vehicle.mileage||0)
 ){

  vehicle.mileage=r.mileage;

 }


 if(r.taskId){

  const t=taskById(r.taskId);

  if(t){

   t.date=r.date;

   t.lastMiles=
    r.mileage||
    t.lastMiles||
    "";

  }

 }


 editing=-1;
 editingRecordId=null;
 recordTaskId=null;

 save();
 render();

};


/* EDIT HISTORY */

function editRecord(i){

 const r=v().history[i];

 editingRecordId=r.id;
 recordTaskId=r.taskId||null;
 editing=-1;

 $("recordHeading").textContent=
  "Edit maintenance record";

 $("recordJob").value=
  r.job||"";

 $("recordDate").value=
  r.date||"";

 $("recordMileage").value=
  r.mileage||"";

 $("recordCost").value=
  r.cost||"";

 $("recordNotes").value=
  r.notes||"";


 const linked=
  linkedPartsForHistory(r.id);

 const editParts=
  linked.length
  ?linked
  :(Array.isArray(r.parts)?r.parts:[]);

 resetRecordParts(editParts);

 $("recordDlg").showModal();
}


/* DELETE HISTORY */

function deleteRecord(i){

 const r=v().history[i];

 const linked=
  linkedPartsForHistory(r.id);

 let message=
  "Are you sure you want to delete this maintenance history entry?";

 if(linked.length){

  message+=
   "\n\nThe Parts & Oils entries linked to this completed job will also be removed.";

 }

 if(!confirm(message)){
  return;
 }

 v().parts=
  v().parts.filter(
   p=>p.historyId!==r.id
  );

 v().history.splice(i,1);

 save();
 render();

}


/* PART / OIL */

function newPart(){

 editingPart=-1;

 $("partForm").reset();

 $("partHeading").textContent=
  "Add part / oil";

 $("partDate").value=today();

 $("partDlg").showModal();
}


function editPart(i){

 editingPart=i;

 const p=v().parts[i];

 $("partHeading").textContent=
  "Edit part / oil";

 $("partName").value=p.name||"";
 $("partDate").value=p.date||"";
 $("partMileage").value=p.mileage||"";
 $("partCategory").value=p.category||"";
 $("partMaker").value=p.maker||"";
 $("partNumber").value=p.number||"";
 $("partCost").value=p.cost||"";
 $("partSpec").value=p.spec||"";
 $("partNotes").value=p.notes||"";

 $("partDlg").showModal();
}


$("partForm").onsubmit=()=>{

 const old=
  editingPart>=0
  ?v().parts[editingPart]
  :null;

 const p={

  id:old?.id||uid("part"),

  name:
   $("partName").value.trim(),

  date:
   $("partDate").value,

  mileage:
   $("partMileage").value,

  category:
   $("partCategory").value.trim(),

  maker:
   $("partMaker").value.trim(),

  number:
   $("partNumber").value.trim(),

  cost:
   $("partCost").value,

  spec:
   $("partSpec").value.trim(),

  notes:
   $("partNotes").value.trim(),

  taskId:
   old?.taskId||null,

  historyId:
   old?.historyId||null

 };


 if(editingPart<0){

  v().parts.push(p);

 }else{

  v().parts[editingPart]=p;

 }


 if(p.historyId){

  const r=historyById(p.historyId);

  if(r){

   if(!Array.isArray(r.partIds)){
    r.partIds=[];
   }

   if(!r.partIds.includes(p.id)){
    r.partIds.push(p.id);
   }

  }

 }


 editingPart=-1;

 save();
 render();

};


function deletePart(i){

 const p=v().parts[i];

 let message=
  "Are you sure you want to delete this part/oil entry?";

 if(p.historyId||p.taskId){

  message+=
   "\n\nIt will also disappear from its linked Maintenance and History records.";

 }

 if(!confirm(message)){
  return;
 }


 if(p.historyId){

  const r=historyById(p.historyId);

  if(r&&Array.isArray(r.partIds)){

   r.partIds=
    r.partIds.filter(
     id=>id!==p.id
    );

  }

 }


 v().parts.splice(i,1);

 save();
 render();

}

/* BACKUP */

function backup(){

 const a=
  document.createElement("a");

 a.href=
  URL.createObjectURL(
   new Blob(
    [JSON.stringify(db,null,2)],
    {type:"application/json"}
   )
  );

 a.download=
  "my-garage-backup.json";

 a.click();

 setTimeout(
  ()=>URL.revokeObjectURL(a.href),
  1000
 );

}


/* RESTORE */

function restore(){

 const i=
  document.createElement("input");

 i.type="file";
 i.accept=".json";

 i.onchange=()=>{

  const r=
   new FileReader();

  r.onload=()=>{

   try{

    const parsed=
     JSON.parse(r.result);

    const fixed=
     normaliseDatabase(parsed);

    if(!fixed){
     throw new Error(
      "Invalid backup format"
     );
    }

    db=fixed;

    localStorage.setItem(
     KEY,
     JSON.stringify(db)
    );

    current=null;

    render();
    save();

    alert(
     "Backup restored and repaired."
    );

   }catch(e){

    alert(
     "Invalid backup. Nothing was changed."
    );

    console.error(e);

   }

  };

  if(i.files[0]){
   r.readAsText(i.files[0]);
  }

 };

 i.click();
}


/* PULL TO REFRESH */

let pullStartY=null;
let pullDistance=0;
let pullRefreshing=false;

const pullIndicator=
 document.getElementById(
  "pullRefreshIndicator"
 );


async function refreshFromCloud(){

 if(pullRefreshing){
  return;
 }

 pullRefreshing=true;

 pullIndicator.textContent=
  "Refreshing…";

 pullIndicator.classList.add("show");

 const loaded=
  await loadFromSupabase();

 render();

 if(loaded){

  showStatus(
   "Refreshed from cloud ✓",
   "ok"
  );

 }else{

  showStatus(
   "Could not refresh cloud data",
   "error"
  );

 }

 setTimeout(()=>{

  pullIndicator.classList.remove("show");
  pullIndicator.textContent=
   "Pull down to refresh";

  pullRefreshing=false;

 },700);

}


document.addEventListener(
 "touchstart",
 e=>{

  if(pullRefreshing){
   return;
  }

  if(
   document.querySelector(
    "dialog[open]"
   )
  ){
   return;
  }

  if(
   window.scrollY<=0 &&
   e.touches.length===1
  ){

   pullStartY=
    e.touches[0].clientY;

   pullDistance=0;

  }

 },
 {passive:true}
);


document.addEventListener(
 "touchmove",
 e=>{

  if(
   pullStartY===null ||
   !e.touches.length
  ){
   return;
  }

  const distance=
   e.touches[0].clientY-
   pullStartY;

  if(distance<=0){
   return;
  }

  pullDistance=distance;

  if(distance>20){

   pullIndicator.classList.add(
    "show"
   );

   pullIndicator.textContent=
    distance>=80
    ?"Release to refresh"
    :"Pull down to refresh";

  }

 },
 {passive:true}
);


document.addEventListener(
 "touchend",
 async()=>{

  if(pullStartY===null){
   return;
  }

  const shouldRefresh=
   pullDistance>=80;

  pullStartY=null;
  pullDistance=0;

  if(shouldRefresh){

   await refreshFromCloud();

  }else{

   pullIndicator.classList.remove(
    "show"
   );

  }

 },
 {passive:true}
);


/* START APP */

async function startApp(){

 render();

 const loaded=
  await loadFromSupabase();

 if(loaded){

  render();

  await save();

 }

}


startApp();
